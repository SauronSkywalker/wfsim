id: stug_incarnon
name: Stug (Incarnon Form)
slot: secondary
weapon_type: secondary
class: pistol
form: incarnon

transform_group: stug
transforms_from: stug

# see notes: bulk_intake_stats_are
unmodeled:
  - "The Incarnon Form Bounce Explosion is not modelled; this form has more parts than this entry carries."
  - "Unpublished: how far an Incarnon pile's explosion grows with its stacks; every pile here goes off at the one-stack 0.3 m."
  - "Unmeasured: how many stacks a shot lays. Read as floor(multishot), the count the Grimoire's multishot buys; rolling the fraction would lay more."
  - reason: blob_over_cap
    cap: 5
  - reason: blob_crossing_cap
    cap: 5
  - "Unmeasured: a pile is read as 200 a stack, the base form's linear scaling applied to the Incarnon explosion."
  - "Unmeasured: the explosion's falloff is read as 70%, the base form's bug note applied to this form."
  - "Unmeasured: when a body dies, its pile is read as staying where it stood and going off on whoever is there."

gauge_form:
  gauge:
    charge_on: direct_hits
    charges_to_fill: 30
    rounds_per_charge: 4
    max_rounds: 120
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 120
  reload_seconds: 3.0

# ORDINARY HERE — THE ROW IS THE BASE FORM'S. Verbatim:
#
#   |{{Weapon|Stug}}||Blob Impact||Projectile||4||0||0%||N/A||Does not apply
#
# "Attack Unmodded Damage 4" is what identifies it: this entry deals 50, the
# base entry deals 4. So the row names the base form's blob and this form has
# none — and a weapon's two FORMS can differ, which is the Torid's rule already
# (`independent` on its base, ordinary on its Incarnon).
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  projectile_speed_mps: 35
  fire_rate: 4
  multishot: 1.0
  ammo_cost: 1                  # of the 120-round charge pool
  crit_chance: 0.15
  crit_multiplier: 2
  status_chance: 0.2
  punch_through_m: 0.0
  damage: { corrosive: 50 }   # total 50
  # THE BLOB ECONOMY at five stacks — docs/MECHANICS.md §7.3, M109: "explode
  # after 1.5 seconds or reaching max stacks", "can stack up to 5 times before
  # exploding, increasing their damage and explosion range". One stack is the
  # module's Incarnon Form Blob Explosion; how far the range grows is
  # unpublished, so a full pile is held at the one-stack radius.
  blob:
    cap: 5
    lifespan_seconds: 1.5
    radius_at_cap_m: 0.3
    explosion:
      damage: { corrosive: 200 }   # total 200
      radius_m: 0.3
      falloff_start_m: 0
      # The base form's bug note, read for the weapon: listed 30%, really 70%.
      falloff_reduction: 0.7
      crit_chance: 0.15
      crit_multiplier: 2
      status_chance: 0.2
      # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/secondary/stug.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Stug_Incarnon_Genesis
  # wiki module Attacks[].AttackName: "Incarnon Form Blob Embed" and "Incarnon Form Blob Explosion"
