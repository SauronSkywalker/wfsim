id: okina_block
name: Okina
# FEY INTERVENTION — Spinning Needle's block combo as `Module:Stances/data`
# prints it: ONE input of three rows over 1.1 s. The module gives the
# forward-block combo the same name. RAGDOLL on the last row is not
# transcribed: nothing in this engine reads one.
inherits: okina
form: block
transform_group: okina
co_behavior: additive_with_base_damage
unmodeled:
  - reason: spectral_dagger_orbit_and_target_assumed
  - reason: dual_daggers_heavy_unmeasured
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.08
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.16
  crit_multiplier: 2.0
  status_chance: 0.2
  punch_through_m: 0.0
  range_m: 1.7
  # `FT^(n-1)` — the module's `FollowThrough`, Dual Daggers.
  follow_through: 0.8
  # see notes: dual_daggers_heavy
  heavy: { multiplier: 2.0, windup_seconds: 0.1667 }
  damage: { impact: 7, puncture: 63, slash: 70 }   # total 140
  # see notes: okina_spectral_dagger
  spectral_dagger:
    damage: { impact: 21, puncture: 49, slash: 70 }
    speed_mps: 18.0
    blast:
      damage: { cold: 140 }
      radius_m: 4.0
      forced_procs: [cold]
      takes_multishot: false
  # see notes: combo_clock_is_the_input
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, delay_seconds: 0.0, combo_points: 1, combo_points_base: 1 }
    - { multiplier: 2.0, delay_seconds: 0.0, combo_points: 2, combo_points_base: 2 }
    - { multiplier: 4.0, delay_seconds: 1.1, combo_points: 4, combo_points_base: 4 }

source:
  url: https://wiki.warframe.com/w/Okina
  # The combo table: https://wiki.warframe.com/w/Spinning_Needle
