id: tenet_exec_block
name: Tenet Exec
# see notes: melee_from_the_modules
inherits: tenet_exec
form: block
transform_group: tenet_exec
co_behavior: additive_with_base_damage
unmodeled:
  - "One attack input's animation length is unpublished: the wiki gives each combo's total at 1.0x attack speed, so totals are exact and inputs are split evenly. This shifts a status tick by fractions of a second and changes no total."
  - "Power Spike's partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number reads low."
  - reason: melee_own_combo_unmodelled
    combos: "heavy slam and slam attack"
  - reason: melee_valence_unmodelled
    family: Tenet
  - "The shockwave's blasts go off with the slam that sends them; the page says the wave travels and times nothing (M110)."
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.38
  crit_multiplier: 2.4
  status_chance: 0.22
  punch_through_m: 0.0
  range_m: 2.8
  follow_through: 0.6
  heavy: { multiplier: 6.0, windup_seconds: 0.3667 }
  damage: { impact: 102.6, slash: 87.4 }   # total 190
  # A slam sends three blasts 5 m apart down the facing (page); each is the
  # slam again in a sphere 3 m across (M110). Only the combo's closing slam.
  shockwave: { lines: 1, explosions: 3, spacing_m: 5.0, width_m: 3.0 }

source:
  url: https://wiki.warframe.com/w/Tenet_Exec
