id: war_block_forward
name: War
# see notes: melee_from_the_modules
inherits: war
form: block_forward
transform_group: war
co_behavior: additive_with_base_damage
unmodeled:
  - "One attack input's animation length is unpublished: the wiki gives each combo's total at 1.0x attack speed, so totals are exact and inputs are split evenly. This shifts a status tick by fractions of a second and changes no total."
  - "Power Spike's partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number reads low."
  - reason: melee_slide_unpublished
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 0.917
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.26
  crit_multiplier: 2.6
  status_chance: 0.26
  punch_through_m: 0.0
  # "Every hit on enemies that are not ragdolled procs an Impact status
  # effect" (page); a ragdolled body is not told apart here.
  forced_procs: [impact]
  range_m: 3.2
  follow_through: 0.6
  heavy: { multiplier: 6.0, windup_seconds: 0.3667 }
  damage: { impact: 120, puncture: 60, slash: 70 }   # total 250

source:
  url: https://wiki.warframe.com/w/War
