id: heat_dagger_block_forward
name: Heat Dagger
# see notes: melee_from_the_modules
inherits: heat_dagger
form: block_forward
transform_group: heat_dagger
co_behavior: additive_with_base_damage
unmodeled:
  - "One attack input's animation length is unpublished: the wiki gives each combo's total at 1.0x attack speed, so totals are exact and inputs are split evenly. This shifts a status tick by fractions of a second and changes no total."
  - "Power Spike's partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number reads low."
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 0.75
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.14
  crit_multiplier: 1.6
  status_chance: 0.14
  punch_through_m: 0.0
  range_m: 1.75
  follow_through: 0.9
  heavy: { multiplier: 2.0, windup_seconds: 0.1333 }
  damage: { impact: 14, puncture: 76, slash: 56, heat: 62 }   # total 208

source:
  url: https://wiki.warframe.com/w/Heat_Dagger
