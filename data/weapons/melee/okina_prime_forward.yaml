id: okina_prime_forward
name: Okina Prime
# ACCURSED WHISPERS — Spinning Needle's forward combo. 1100% over 2.15 s at
# 1.0x, four inputs of 0.5375 s; the third spins five times.
inherits: okina_prime
form: forward
transform_group: okina_prime
co_behavior: additive_with_base_damage
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.17
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.3
  crit_multiplier: 2.6
  status_chance: 0.24
  punch_through_m: 0.0
  range_m: 1.7
  # `FT^(n-1)` — the module's `FollowThrough`, Dual Daggers.
  follow_through: 0.8
  # see notes: dual_daggers_heavy
  heavy: { multiplier: 2.0, windup_seconds: 0.1667 }
  damage: { impact: 9.2, puncture: 64.4, slash: 110.4 }   # total 184
  # see notes: okina_spectral_dagger
  spectral_dagger:
    damage: { impact: 27.6, puncture: 64.4, slash: 92 }
    speed_mps: 18.0
    blast:
      damage: { cold: 184 }
      radius_m: 4.0
      forced_procs: [cold]
      takes_multishot: false
  # see notes: combo_clock_is_the_input
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, delay_seconds: 0.5375, combo_points: 1, combo_points_base: 1 }
    - { multiplier: 1.0, delay_seconds: 0.0, hits: 2, all_around: true, combo_points: 1, combo_points_base: 1 }
    - { multiplier: 2.0, delay_seconds: 0.5375, combo_points: 2, combo_points_base: 2 }
    - { multiplier: 1.0, delay_seconds: 0.5375, hits: 5, all_around: true, combo_points: 1, combo_points_base: 1 }
    - { multiplier: 3.0, delay_seconds: 0.5375, forced_procs: [lifted], combo_points: 3, combo_points_base: 3 }

source:
  url: https://wiki.warframe.com/w/Okina_Prime
