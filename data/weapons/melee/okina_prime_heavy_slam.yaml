id: okina_prime_heavy_slam
name: Okina Prime
# NOTHING BUT HEAVY SLAMS, the mode no stance changes. Entirely radial: the
# infobox's Heavy Slam Attack is 3x base as Blast in a 7 m sphere, linear
# falloff to 70% at the edge, centred on the wielder.
inherits: okina_prime
form: heavy_slam
transform_group: okina_prime
co_behavior: additive_with_base_damage
unmodeled:
  - reason: spectral_dagger_orbit_and_target_assumed
  - "The climb is not timed: this loop takes the 150% radius of a slam dropped from 15 m and spends no time getting up there. A player who hops instead gets less radius, down to the 2.5 m / listed floor; this fight has no vertical axis to tell the two apart."
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.17
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.3
  crit_multiplier: 2.6
  status_chance: 0.24
  punch_through_m: 0.0
  range_m: 1.7
  # see notes: dual_daggers_heavy
  heavy: { multiplier: 2.0, windup_seconds: 0.1667 }
  spends_combo: true
  damage: { impact: 0.0 }
  radial:
    damage: { blast: 552 }
    radius_m: 7.0
    blast_kind: slam
    status_chance: 0.1
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    forced_procs: []
    takes_multishot: false
  # see notes: okina_spectral_dagger
  spectral_dagger:
    damage: { impact: 27.6, puncture: 64.4, slash: 92 }
    speed_mps: 18.0
    blast:
      damage: { cold: 184 }
      radius_m: 4.0
      forced_procs: [cold]
      takes_multishot: false
  # CLIMB -> SLAM -> RECOVER, and two seconds is the same stand-in for the
  # landing recovery every heavy slam in the roster carries (docs/MELEE.md).
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, delay_seconds: 2.0, forced_procs: [lifted], combo_points: 0, combo_points_base: 0 }

source:
  url: https://wiki.warframe.com/w/Okina_Prime
