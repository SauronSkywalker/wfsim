id: okina_prime_heavy
name: Okina Prime
# SAVAGE TIGER — nothing but heavy attacks, the class's own and identical
# under every Dual Daggers stance. Each input lands TWICE at 100% and forces
# Bleed and Knockdown — see `notes: dual_daggers_heavy` for why 2x and
# not the class table's 5x.
inherits: okina_prime
form: heavy
transform_group: okina_prime
co_behavior: additive_with_base_damage
unmodeled:
  - reason: heavy_charge_share_assumed
    published: 0.5
    charge: 0.17
    swing: 0.33
  - reason: spectral_dagger_orbit_and_target_assumed
  - reason: dual_daggers_heavy_unmeasured
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.17
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.3
  crit_multiplier: 2.6
  status_chance: 0.24
  punch_through_m: 0.0
  range_m: 1.7
  # `FT^(n-1)` — the module's `FollowThrough`, Dual Daggers.
  follow_through: 0.8
  # see notes: dual_daggers_heavy
  heavy: { multiplier: 2.0, windup_seconds: 0.1667 }
  spends_combo: true
  damage: { impact: 9.2, puncture: 64.4, slash: 110.4 }   # total 184
  # see notes: okina_spectral_dagger
  spectral_dagger:
    damage: { impact: 27.6, puncture: 64.4, slash: 92 }
    speed_mps: 18.0
    blast:
      damage: { cold: 184 }
      radius_m: 4.0
      forced_procs: [cold]
      takes_multishot: false
  # THE WIND-UP IS ON THE SWING: the charge before EVERY heavy, the swing after it.
  # see notes: tonfa_heavy_timing
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, hits: 2, windup_seconds: 0.1667, delay_seconds: 0.3333, forced_procs: [slash, knockdown], combo_points: 0, combo_points_base: 0 }
    - { multiplier: 1.0, hits: 2, windup_seconds: 0.1667, delay_seconds: 0.3333, forced_procs: [slash, knockdown], combo_points: 0, combo_points_base: 0 }

source:
  url: https://wiki.warframe.com/w/Okina_Prime
