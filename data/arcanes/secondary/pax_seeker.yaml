id: pax_seeker
name: Pax Seeker
rarity: rare
max_rank: 3
description: "On Headshot Kill: Releases X Homing projectiles."

equip_traits: [modular]
# see notes: own_seat_whole_point
#
# see notes: kitgun_rather_than_modular
seats: [kitgun]

effects:
  # A SECOND DAMAGE INSTANCE, and NOT a member of docs/EXTRA_HIT.md: an Extra
  # Hit is a percentage of the hit that spawned it, and this is its own damage
  # with its own formula, its own element split and its own crit stats. Filed as
  # unmodelled rather than approximated, with the whole formula transcribed
  # below so that implementing it is transcription and not research.
  #
  # THE TRIGGER is a HEADSHOT KILL by the weapon: "the enemy must be headshot
  # killed by the Kitgun, and not any damage-over-time status effect such as
  # Slash" — with the exception that an Electricity or Gas proc CAN trigger it,
  # since those "can target specific body parts", and only if the killing proc
  # was itself inflicted by a headshot.
  #
  # THE DAMAGE, per the weapon's own page, for the four chambers it names. The
  # Tombfinger's case:
  #
  #   2 x [ (Barrel Base Damage) x (1 + Base Damage Buffs)
  #                              x (1 + Multishot Buffs) ] + Grip Damage Bonus
  #
  # where "Barrel Base Damage" is the chamber's `base` row — the module's no-grip
  # preview, which is what that row is FOR — and "Grip Damage Bonus" is the
  # chosen grip's total minus it. Gaze and Rattleguts put the grip bonus inside
  # the bracket as well; Catchmoon drops the leading x2.
  #
  #   * multishot counts in INTEGER multiples (a +150% bonus is x2, with a 50%
  #     chance of x3);
  #   * elemental bonuses apply after everything else;
  #   * Galvanized Aptitude / Galvanized Shot are MULTIPLICATIVE on the total;
  #   * the projectiles carry the kitgun's crit stats and take DOUBLE the bonus
  #     from crit chance and crit damage mods;
  #   * 50% Slash / 50% Puncture plus any modded elements, one forced Impact
  #     proc each, and they aim for the head — except on a Catchmoon, which
  #     cannot headshot with them;
  #   * unaffected by punch through.
  - kind: unmodelled
    rank0: 1
    rankMax: 4

unmodeled:
  - "The homing bolts are not fired: a headshot kill releases 1-4 bolts, half Slash and half Puncture, with a forced Impact proc and double benefit from crit mods. A headshot build with this arcane reads low by everything the bolts would deal."

source:
  url: https://wiki.warframe.com/w/Pax_Seeker
