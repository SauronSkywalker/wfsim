    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 1.1667, forced_procs: [impact], combo_points: 1, combo_points_base: 1 }
    - { multiplier: 3.0, delay_seconds: 1.1667, combo_points: 3, combo_points_base: 3 }
    - { multiplier: 4.0, delay_seconds: 1.1666, all_around: true, forced_procs: [knockdown], combo_points: 4, combo_points_base: 4 }

effects:
  # A STANCE IS NOT A STAT — its whole payload is the `combos:` above.
  - kind: out_of_scope

