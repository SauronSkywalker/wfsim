    - { multiplier: 3.0, delay_seconds: 1.1, combo_points: 3, combo_points_base: 3 }
    - { multiplier: 2.0, delay_seconds: 0.0, combo_points: 2, combo_points_base: 2 }
    - { multiplier: 2.0, delay_seconds: 0.0, forced_procs: [slash], combo_points: 2, combo_points_base: 2 }
    - { multiplier: 4.0, delay_seconds: 1.1, forced_procs: [knockdown], combo_points: 4, combo_points_base: 4 }
  # Cutting Thrice — 2.55 s at 1.0x, 3 inputs
  forward:
    - { multiplier: 2.0, delay_seconds: 0.85, combo_points: 2, combo_points_base: 2 }
    - { multiplier: 2.0, delay_seconds: 0.85, combo_points: 2, combo_points_base: 2 }
    - { multiplier: 4.0, delay_seconds: 0.85, combo_points: 4, combo_points_base: 4 }
  # Calling Thunder — 3.5 s at 1.0x, 3 inputs
  block_forward:
