# THE RIVEN APPRAISAL'S SEARCH — a preset like a player's own optimizer preset,
# applied to the page that opens an appraisal link (docs/AGENT.md §"Riven
# appraisal"). The search knows nothing of appraisals; this is all it is given.
#
# FOUR STARTS, each the asker's riven, pinned, beside one primary element's
# 60/60 card (element plus status chance). A row names that element's card for
# every mod class, and a start takes the one of them the weapon can equip.
finalists: 1
candidate_runs: 10
starts:
  - [thermite_rounds, scattering_inferno, scorch, volcanic_edge, magma_chamber]
  - [rime_rounds, frigid_blast, frostbite, vicious_frost, hypothermic_shell]
  - [high_voltage, shell_shock, jolt, voltaic_strike, charged_bullets]
  - [malignant_force, toxic_barrage, pistol_pestilence, virulent_scourge, contamination_casing]
